[project]
name = "clinical-data-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.5",
    "celery[redis]==5.6.3",
    "boto3==1.43.95",
    "python-multipart==0.0.32",
    "pymupdf==1.28.2",
    "pillow==12.3.0",
    "pyjwt[crypto]==2.14.0",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.7", "mypy==2.3.1", "jsonschema==4.26.0", "types-jsonschema==4.26.0.20260518", "pip-audit==2.10.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
