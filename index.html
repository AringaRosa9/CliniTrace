function labDocument(){return `<div class="paper-head"><div class="paper-hospital">示例临床研究中心</div><div class="paper-title">检 验 报 告</div><div class="paper-no">LABORATORY REPORT · LAB-024</div></div><div class="paper-meta"><span>患者编号：PT-024</span><span>性别／年龄：男／56岁</span><span>送检科室：内分泌科</span><span>${mark('date','检验日期：2026-09-01')}</span></div><p style="font-size:10px">样本：静脉血清／EDTA抗凝全血<br>采样时间：2026-09-01 08:12</p><table><thead><tr><th>检验项目</th><th>结果</th><th>单位</th></tr></thead><tbody><tr><td>空腹血糖（GLU）</td><td>${mark('glucose','8.2',true)}</td><td>mmol/L</td></tr><tr><td>糖化血红蛋白<br>（HbA1c）</td><td>${mark('hba1c','7.6')}</td><td>%</td></tr></tbody></table><p style="font-size:10px;margin-top:23px">标本对应：空腹血糖—静脉血清；<br>糖化血红蛋白—EDTA抗凝全血。</p><p style="font-size:10px">检测方法：原始报告未注明。<br>注：本报告数值为产品演示构造数据。</p><div class="paper-foot"><span>检验者：示例检验员</span><span>报告日期：2026-09-01</span></div><div class="paper-watermark">合成文书 · 仅供产品演示</div>`}

 if(state.tab==='json')return `<pre class="json-view">${esc(JSON.stringify(exportData(),null,2))}</pre>`;
 if(state.tab==='timeline')return `<div class="timeline"><div class="timeline-entry"><time>病程描述 · ${esc(fields.find(f=>f.id==='duration').value)}</time><h3>${esc(fields[0].value)}</h3><p>原文相对时长，无法确定精确起病日期。</p></div><div class="timeline-entry"><time>${esc(fields.find(f=>f.id==='date').value)}</time><h3>门诊复诊与检验</h3><p>空腹血糖 ${esc(fields[5].value)} mmol/L<br>糖化血红蛋白 ${esc(fields[6].value)} %</p></div><div class="timeline-entry"><time>当前记录</time><h3>${esc(fields[3].value)}</h3><p>用药剂量：${esc(fields[4].value)}。${state.resolved.dose?'已人工确认处理方式。':'待人工核实。'}</p></div></div>`;

function issueHTML(key,tag,title,desc,action){const done=state.resolved[key];return `<div class="issue ${done?'resolved':''}"><div class="issue-top">${icon(done?'check':'warning')}${done?'已确认处理':tag}</div><p><strong style="font-weight:500">${title}</strong><br>${done?(key==='dose'?'已记录剂量处理方式，保留来源依据。':'已保留待映射状态，未自动补全编码。'):desc}</p><button class="text-button" data-issue="${key}">${done?'查看处理记录':action}${icon('arrow-right')}</button></div>`}
function historyHTML(){const list=[...state.history,{time:'09:42',text:'结构化结果已生成 · 8个字段'},{time:'09:41',text:'2份合成文书已关联'}];return list.slice(0,3).map(h=>`<div class="history-item">${esc(h.text)}<time>${esc(h.time)}</time></div>`).join('')}
function selectField(id){state.selected=id;state.doc=fields.find(f=>f.id===id).doc;
 const doc=$('.document-scroll');if(doc)doc.innerHTML=`<article class="paper" style="zoom:${state.zoom/100}">${state.doc==='note'?noteDocument():labDocument()}</article>`;
 $$('[data-doc]').forEach(b=>{b.classList.toggle('active',b.dataset.doc===state.doc);b.setAttribute('aria-pressed',String(b.dataset.doc===state.doc))});
 $$('[data-field]').forEach(b=>{b.classList.toggle('selected',b.dataset.field===id);b.setAttribute('aria-pressed',String(b.dataset.field===id))});
 $$('[data-evidence]').forEach(b=>b.onclick=()=>{if(state.tab!=='fields'||state.onlyIssues){state.tab='fields';state.onlyIssues=false;render()}selectField(b.dataset.evidence);$(`[data-field="${b.dataset.evidence}"]`)?.scrollIntoView({block:'nearest',behavior:'smooth'})});

function bindPage(){
 $$('[data-action]').forEach(b=>b.addEventListener('click',()=>handleAction(b.dataset.action)));

 $$('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});
 $$('[data-field]').forEach(b=>{b.onclick=()=>selectField(b.dataset.field);b.ondblclick=()=>editField(b.dataset.field)});
 $$('[data-evidence]').forEach(b=>b.onclick=()=>{if(state.tab!=='fields'||state.onlyIssues){state.tab='fields';state.onlyIssues=false;render()}selectField(b.dataset.evidence);$(`[data-field="${b.dataset.evidence}"]`)?.scrollIntoView({block:'nearest',behavior:'smooth'})});
 $$('[data-issue]').forEach(b=>b.onclick=()=>issueDrawer(b.dataset.issue));
 $$('[data-open-doc]').forEach(b=>b.onclick=()=>{state.doc=b.dataset.openDoc;navigate('review')});
 $$('[data-preview]').forEach(b=>b.onclick=()=>previewImport(Number(b.dataset.preview)));

 if($('#onlyIssues'))$('#onlyIssues').onchange=e=>{state.onlyIssues=e.target.checked;render()};
 if($('#documentSearch'))$('#documentSearch').oninput=e=>{state.search=e.target.value;renderDocumentRows()};
 if($('#termSearch'))$('#termSearch').oninput=e=>{const q=e.target.value.trim().toLowerCase();$$('#termBody tr').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(q))};
}
function handleAction(action){({upload:uploadDrawer,export:exportDrawer,approve:approve,history:historyDrawer,help:helpDrawer,editSelected:()=>editField(state.selected),zoomIn:()=>{state.zoom=Math.min(150,state.zoom+10);render()},zoomOut:()=>{state.zoom=Math.max(80,state.zoom-10);render()},review:()=>navigate('review'),viewSchema:schemaDrawer,viewGuide:guideDrawer,viewQuality:qualityDrawer})[action]?.()}
function openDrawer(title,body,foot=''){lastFocus=document.activeElement;$('#drawerTitle').textContent=title;$('#drawerBody').innerHTML=body;$('#drawerFooter').innerHTML=foot;$('#drawer').inert=false;$('#drawer').setAttribute('aria-hidden','false');$('#drawer').classList.add('open');$('#backdrop').classList.add('open');$('.shell').inert=true;document.body.style.overflow='hidden';$('#closeDrawer').focus()}
function closeDrawer(){if(activeURL){URL.revokeObjectURL(activeURL);activeURL=null}$('#drawer').classList.remove('open');$('#backdrop').classList.remove('open');$('#drawer').inert=true;$('#drawer').setAttribute('aria-hidden','true');$('.shell').inert=false;document.body.style.overflow='';if(lastFocus?.isConnected)lastFocus.focus();else $('.nav-button.active')?.focus()}
function editField(id){const f=fields.find(f=>f.id===id);state.editId=id;openDrawer('编辑 · '+f.label,`<div class="form-hint">原文证据 · ${f.doc==='note'?'门诊病历':'检验报告'} / 第1页</div><blockquote class="evidence-quote">“${esc(f.quote)}”</blockquote><div class="form-field"><label for="editValue">${f.label}${f.unit?'（'+f.unit+'）':''}</label><input id="editValue" value="${esc(f.value)}" ${f.unit?'inputmode="decimal"':''}><p class="form-hint">请忠实于原文；无依据时保留未知，不补全推测值。</p></div><div class="form-field"><label for="editReason">修改理由 <span class="muted">（必填）</span></label><textarea id="editReason" placeholder="说明原文依据及修改原因…"></textarea></div><p class="error-text" id="editError" role="alert"></p><div class="notice">修改后，本病例将保持待审核状态。页面刷新会恢复演示数据。</div>`,`<button class="button" id="cancelEdit">取消</button><button class="button primary" id="saveEdit">保存修改</button>`);$('#cancelEdit').onclick=closeDrawer;$('#saveEdit').onclick=()=>{
 const value=$('#editValue').value.trim(),reason=$('#editReason').value.trim();
 if(!value||!reason){$('#editError').textContent='请填写字段值和修改理由。';return}
 if(f.unit&&(!Number.isFinite(Number(value))||Number(value)<0)){$('#editError').textContent='检验结果请填写有效的非负数值。';return}
 if(f.id==='date'&&(!/^\d{4}-\d{2}-\d{2}$/.test(value)||Number.isNaN(Date.parse(value))||new Date(value).toISOString().slice(0,10)!==value)){$('#editError').textContent='日期请使用 YYYY-MM-DD 格式。';return}
 const before=f.value;f.value=value;f.edited=value!==originalFields.find(o=>o.id===id).value;f.reviewNote=reason;
 if(f.id==='dose'){f.missingReason=value==='未知'?'explicitly_unknown':null;state.resolved.dose=false}
 if(f.id==='glucose')state.resolved.coding=false;
 if(f.id==='negative')f.assertion=value==='明确否认'?'negated':'needs_review';
 invalidate();log(`修改「${f.label}」`,{fieldId:id,before,after:value,reason});closeDrawer();render();toast('修改已保存，请重新核对后提交审核。')
 }}
function issueDrawer(key){const f=fields.find(f=>f.id===(key==='dose'?'dose':'glucose'));if(state.resolved[key]){historyDrawer();return}const isDose=key==='dose';openDrawer(isDose?'复核药物剂量':'复核术语映射',`<div class="status warn">${icon('warning')}需人工判断</div><blockquote class="evidence-quote" style="margin-top:17px">“${esc(f.quote)}”</blockquote><div class="notice warn">${isDose?'原文未提供具体剂量。请保留未知，不依据常规剂量推测。':'报告未提供检验方法，无法在此演示中唯一确定 LOINC 编码。保留原始项目与数值，编码留待映射。'}</div><div class="form-field"><label for="resolutionNote">处理说明</label><textarea id="resolutionNote">${isDose?(f.value==='未知'?'原文明确记载剂量不详，保留未知值，后续可补充原始处方。':'已依据原文完成剂量修正，请复核修改记录。'):'缺少检验方法，保留待映射状态，不生成未经核实的编码。'}</textarea></div><p id="resolutionError" class="error-text" role="alert"></p>`,`<button class="button" id="cancelResolution">取消</button><button class="button primary" id="saveResolution">${isDose?(f.value==='未知'?'确认保留未知':'确认当前处理'):'确认保留待映射'}</button>`);$('#cancelResolution').onclick=closeDrawer;$('#saveResolution').onclick=()=>{const reason=$('#resolutionNote').value.trim();if(!reason){$('#resolutionError').textContent='请填写处理说明。';return}state.resolved[key]=true;invalidate();log(isDose?'已确认药物剂量处理':'检验编码保留待映射',{fieldId:f.id,reason});closeDrawer();render();toast('已记录处理说明，原始证据仍保留。')}}
function approve(){if(unresolved()){toast(`还有 ${unresolved()} 项质量问题需要处理，请查看右侧质量检查。`);return}if(!state.ack){toast('请先核对全部字段，并勾选“我已核对原文与全部字段”。');$('#reviewAck').focus();return}if(fields.find(f=>f.id==='negative').assertion==='needs_review'){toast('冠心病史为否定原文，请恢复“明确否认”后提交。');editField('negative');return}state.approved=true;log('林医生完成病例审核');render();toast('审核已完成，可在数据集中导出本病例。')}
function exportData(){return {product:'临床数据结构化平台',demo:true,patient_id:'PT-20260901-024',encounter_id:'ENC-20260901-024',schema_version:'endocrinology-v1.0',model_version:'preset-demo-no-model',review_status:state.approved?'approved':'draft',exported_at:new Date().toISOString(),facts:fields.map(f=>({fact_id:f.id,label:f.label,value:f.id==='dose'&&f.value==='未知'?null:f.unit?Number(f.value):f.value,unit:f.unit||null,assertion:f.assertion||'affirmed',missing_reason:f.missingReason||null,coding:f.codingStatus?{system:'LOINC',version:null,code:null,status:f.codingStatus}:null,evidence:{document_id:f.doc==='note'?'DOC-NOTE-024':'DOC-LAB-024',page:1,quote:f.quote},reviewed:state.approved,edited:!!f.edited,review_note:f.reviewNote||null})),issue_dispositions:{...state.resolved},review_history:state.history}}
function exportDrawer(){openDrawer('导出结构化数据',`<div class="notice ${state.approved?'':'warn'}">${state.approved?'本病例已完成审核，将导出已审核结果。':'当前病例尚未完成审核，导出内容会明确标记为 draft（草稿）。'}</div><div class="form-field"><label for="exportFormat">文件格式</label><select id="exportFormat"><option value="json">JSON · 完整事实、证据和审核记录</option><option value="csv">CSV · 一行一个字段，适合表格分析</option></select></div><div class="form-field"><label>导出范围</label><p style="font-size:12px">PT-20260901-024 · 当前病例的8个字段</p><p class="form-hint">包含当前修改值、文书来源、原文证据及审核状态。合成演示数据。</p></div>`,`<button class="button" id="cancelExport">取消</button><button class="button primary" id="downloadExport">${icon('download')}下载文件</button>`);$('#cancelExport').onclick=closeDrawer;$('#downloadExport').onclick=()=>{const format=$('#exportFormat').value;let data=exportData(),content,type;if(format==='json'){content=JSON.stringify(data,null,2);type='application/json'}else{const safe=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};content='\uFEFF'+[['患者编号','就诊编号','字段','值','单位','语义状态','文书编号','页码','原文证据','审核状态','模板版本'],...data.facts.map(f=>[data.patient_id,data.encounter_id,f.label,f.value,f.unit,f.assertion,f.evidence.document_id,f.evidence.page,f.evidence.quote,data.review_status,data.schema_version])].map(row=>row.map(safe).join(',')).join('\r\n');type='text/csv;charset=utf-8'}const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=`临床数据结构化平台_PT-024_${data.review_status}.${format}`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);closeDrawer();toast('已生成 '+format.toUpperCase()+' 文件。')}}
function historyDrawer(){openDrawer('完整操作记录',`<div class="notice">演示记录仅存于当前页面，不代表已写入生产审计系统。</div>${[...state.history,{time:'09:42',text:'预置结构化结果载入 · 8个字段'},{time:'09:41',text:'2份合成文书载入'}].map(h=>`<div class="timeline-entry"><time>${esc(h.time)}</time><h3>${esc(h.text)}</h3>${h.before!==undefined?`<p>${esc(h.before)} → ${esc(h.after)}</p>`:''}${h.reason?`<p>${esc(h.reason)}</p>`:''}</div>`).join('')}`)}
function renderDocuments(){return heading('文档任务','DOCUMENT LIBRARY','集中管理原始文书，追踪每一次数据处理。',uploadButton())+`<section class="data-panel"><div class="data-toolbar"><div><strong style="font-size:12px">全部文档 <span class="muted" style="font-weight:400">${2+state.imported.length}</span></strong><span class="muted" style="font-size:10px;margin-left:14px">门诊病历与检验报告</span></div><input id="documentSearch" class="inline-search" placeholder="搜索文件名、病例编号…" aria-label="搜索文档" value="${esc(state.search)}"></div><div class="table-scroll"><table><thead><tr><th>文档名称</th><th>病例编号</th><th>文书类型</th><th>状态</th><th>操作</th></tr></thead><tbody id="documentRows">${documentRows()}</tbody></table></div><div class="table-foot">示例文档使用预置结果。本地导入文件仅供预览，不会上传。</div></section>`}
function documentRows(){let docs=[{name:'门诊病历_PT024.pdf',detail:'合成文书 · 1页',patient:'PT-20260901-024',type:'门诊记录',doc:'note'},{name:'检验报告_PT024.pdf',detail:'合成文书 · 1页',patient:'PT-20260901-024',type:'检验报告',doc:'lab'},...state.imported.map((x,i)=>({name:x.file.name,detail:'本地预览 · '+(x.file.size/1024).toFixed(1)+' KB',patient:'尚未关联',type:x.kind==='text'?'文本':x.kind==='image'?'图片':'PDF',idx:i}))];docs=docs.filter(d=>(d.name+' '+d.patient).toLowerCase().includes(state.search.toLowerCase()));return docs.length?docs.map(d=>`<tr><td><div class="table-primary"><div class="file-icon">${icon('doc')}</div><div><strong>${esc(d.name)}</strong><small>${esc(d.detail)}</small></div></div></td><td class="mono">${d.patient}</td><td>${d.type}</td><td>${d.doc?statusHTML():'<span class="status neutral">仅本地预览</span>'}</td><td><button class="button sm" ${d.doc?'data-open-doc="'+d.doc+'"':'data-preview="'+d.idx+'"'}>${d.doc?'进入审核':'查看文档'}${icon('arrow-right')}</button></td></tr>`).join(''):'<tr><td colspan="5"><div class="empty">没有匹配的文档，请尝试其他关键词。</div></td></tr>'}
function renderDocumentRows(){$('#documentRows').innerHTML=documentRows();$$('[data-open-doc]').forEach(b=>b.onclick=()=>{state.doc=b.dataset.openDoc;navigate('review')});$$('[data-preview]').forEach(b=>b.onclick=()=>previewImport(Number(b.dataset.preview)))}
function uploadDrawer(){openDrawer('导入文档',`<div class="notice">当前为界面原型。文件只在本机浏览器中预览，尚未接入 OCR 或 AI 抽取。请使用演示资料。</div><div class="upload-zone" id="uploadZone">${icon('upload')}<h3>将文件拖放到这里</h3><p>支持 PDF、TXT、PNG、JPG · 单个文件不超过20 MB</p><input id="fileInput" type="file" accept=".pdf,.txt,.png,.jpg,.jpeg" aria-label="选择本地文档" multiple></div><p class="error-text" id="uploadError" role="alert"></p><div id="uploadList"></div><div class="form-hint">也可以直接使用工作台中预置的合成病例，体验完整审核流程。</div>`,`<button class="button" id="openSample">打开合成病例</button><button class="button primary" id="finishImport">完成</button>`);$('#openSample').onclick=()=>{closeDrawer();navigate('review')};$('#finishImport').onclick=()=>{closeDrawer();navigate('documents')};$('#fileInput').onchange=e=>importFiles([...e.target.files]);const zone=$('#uploadZone');zone.ondragover=e=>{e.preventDefault();zone.classList.add('dragover')};zone.ondragleave=()=>zone.classList.remove('dragover');zone.ondrop=e=>{e.preventDefault();zone.classList.remove('dragover');importFiles([...e.dataTransfer.files])}}
async function importFiles(files){const errors=[];for(const file of files){const ext=file.name.split('.').pop().toLowerCase();if(!['pdf','txt','png','jpg','jpeg'].includes(ext)){errors.push(file.name+'：不支持的格式');continue}if(file.size>20*1024*1024){errors.push(file.name+'：超过20 MB');continue}if(!file.size){errors.push(file.name+'：文件为空');continue}const kind=ext==='txt'?'text':ext==='pdf'?'pdf':'image';state.imported.push({file,kind,text:kind==='text'?await file.text():null})}if($('#uploadError'))$('#uploadError').textContent=errors.join('；');if($('#uploadList'))$('#uploadList').innerHTML=state.imported.map(f=>`<div class="notice">${esc(f.file.name)}<br><small>已载入浏览器 · 未进行抽取</small></div>`).join('');$('#docCount').textContent=state.imported.length+2}
function previewImport(index){const d=state.imported[index];openDrawer(d.file.name,`<div class="notice">仅本地预览 · 尚未接入解析服务，未生成结构化结果。</div><div id="importPreview"></div>`);if(d.kind==='text'){$('#importPreview').innerHTML=`<pre class="preview-text">${esc(d.text)}</pre>`}else{activeURL=URL.createObjectURL(d.file);const el=document.createElement(d.kind==='image'?'img':'iframe');el.className=d.kind==='image'?'import-image':'preview-frame';el.src=activeURL;if(d.kind==='image')el.alt='本地导入文档预览';else el.title='本地PDF预览';$('#importPreview').appendChild(el)}}
function renderTemplates(){return heading('抽取模板','EXTRACTION SCHEMA','先定义什么是正确的数据，再让模型开始抽取。',`<button class="button" data-action="viewGuide">${icon('book')}标注指南</button><button class="button primary" data-action="viewSchema">查看 Schema</button>`)+`<section class="data-panel"><div class="section-intro"><div style="display:flex;align-items:center;gap:12px"><h2>内分泌科通用模板</h2><span class="status">v1.0 · 演示版本</span></div><p>适用于门诊病历与检验报告，包含8个演示字段。生产版需由临床专家确认指南。</p></div><div class="table-scroll"><table><thead><tr><th>字段组</th><th>字段</th><th>数据类型</th><th>原文证据</th><th>语义要求</th></tr></thead><tbody>${fields.map(f=>`<tr><td>${f.group}</td><td>${f.label}</td><td>${f.unit?'number':f.id==='date'?'date':'string'}${f.id==='dose'?' | null':''}</td><td><span class="status">必需</span></td><td>${f.id==='negative'?'必须保留否定状态':f.id==='dose'?'允许未知，必须说明原因':f.unit?'保留原始单位':f.id==='duration'?'保留相对时长':'不得无依据补全'}</td></tr>`).join('')}</tbody></table></div><div class="table-foot">发布模板应固定版本；本原型仅展示模板与约束，不提供生产发布功能。</div></section>`}
function schemaDrawer(){openDrawer('内分泌科模板 · Schema',`<div class="notice">简化字段定义示例；生产 Schema 需补齐嵌套记录、校验与版本约束。</div><pre class="json-view">${esc(JSON.stringify({schema_id:'endocrinology-v1.0',evidence_required:true,fields:fields.map(f=>({key:f.id,label:f.label,type:f.unit?'number':f.id==='date'?'date':'string',nullable:f.id==='dose',unit:f.unit||undefined}))},null,2))}</pre>`)}
function guideDrawer(){openDrawer('标注指南 · v1.0',`<div class="notice">用于演示标注约定，尚未经过医学专家审定。</div>${[['忠实于原文','未提及、明确否认、无法辨认、明确未知应分别标注。'],['保留语义','“否认冠心病史”标注为否定，不能变成阳性诊断。'],['剂量不推测','原文写“剂量不详”，值为 null，缺失原因为 explicitly_unknown。'],['事件时间有依据','保留病程相对时长，区分检验日期与文书记录日期。'],['证据必须可定位','每条事实关联文书、页码、原文片段；扫描件保存坐标。'],['分歧需裁决','标注人员有分歧时交由医学复核人员裁决，保留版本与理由。']].map(([a,b])=>`<div class="timeline-entry"><h3>${a}</h3><p>${b}</p></div>`).join('')}`)}
function renderTerminology(){const rows=[['2型糖尿病','疾病名称','ICD','待选择机构采用版本','待映射'],['空腹血糖','检验项目','LOINC','缺少方法信息','待映射'],['糖化血红蛋白','检验项目','LOINC','需核实报告方法','待映射'],['二甲双胍','药物名称','机构药物词库','尚未接入正式词库','保留原文']];return heading('术语管理','TERMINOLOGY','保留临床原意，让术语映射有依据、可核实。')+`<section class="data-panel"><div class="data-toolbar"><h2>当前病例 · 术语候选</h2><input id="termSearch" class="inline-search" placeholder="搜索术语、编码体系…" aria-label="搜索术语"></div><div class="table-scroll"><table><thead><tr><th>原始表述</th><th>类别</th><th>目标体系</th><th>映射依据</th><th>状态</th></tr></thead><tbody id="termBody">${rows.map(r=>`<tr><td><strong style="font-weight:500">${r[0]}</strong></td><td>${r[1]}</td><td>${r[2]}</td><td class="muted">${r[3]}</td><td><span class="status warn">${r[4]}</span></td></tr>`).join('')}</tbody></table></div><div class="page-description">当前原型未接入正式术语库，因此不展示未经核实的编码。真实产品将提供词库候选检索、上下文消歧、版本记录与医学确认。</div></section>`}
function renderDatasets(){return heading('结构化数据集','RESEARCH DATASET','把完成审核的临床事实，交付到下一步研究。',exportButton())+`<section class="data-panel"><div class="section-intro"><h2>2型糖尿病 · 临床数据整理</h2><p>合成数据集 / 内分泌科 / endo-demo-v1</p></div><div class="metric-strip"><div class="metric"><span>病例数</span><strong>1</strong><small>2份关联文书</small></div><div class="metric"><span>结构化字段</span><strong>8</strong><small>全部关联原文证据</small></div><div class="metric"><span>已审核病例</span><strong>${state.approved?'1':'0'}</strong><small>${state.approved?'可导出已审核结果':'待完成医学复核'}</small></div></div><div class="table-scroll"><table><thead><tr><th>病例编号</th><th>文书</th><th>字段</th><th>质量问题</th><th>审核状态</th><th>操作</th></tr></thead><tbody><tr><td class="mono">PT-20260901-024</td><td>2份</td><td>8项</td><td>${unresolved()}项待复核</td><td>${statusHTML()}</td><td><button class="button sm" data-action="review">${state.approved?'查看结果':'继续审核'}${icon('arrow-right')}</button></td></tr></tbody></table></div><div class="table-foot">${state.approved?'当前结果已审核，仍保留未知剂量与未映射编码的处理记录。':'当前导出仅为明确标记的草稿。完成审核后可导出已审核版本。'}</div></section>`}
function renderQuality(){const rows=[['诊断与否定语义',20,1,0],['药物名称',18,1,1],['剂量与单位',16,2,2],['检验指标',23,1,1],['事件日期',14,1,1]];return heading('质量评测','QUALITY & EVALUATION','同时看见模型提取的质量，与人工修正的成本。',`<button class="button" data-action="viewQuality">${icon('info')}指标口径</button>`)+`<section class="data-panel"><div class="section-intro"><div style="display:flex;align-items:center;gap:10px"><h2>字段抽取评测示例</h2><span class="status warn">模拟结果 · 非实测</span></div><p>以下为展示评测布局的构造计数，与工作台审核进度无关。正式评测需使用冻结金标准集。</p></div><div class="metric-strip"><div class="metric"><span>字段精确率</span><strong>93.8<small>%</small></strong><small>TP 91 /（TP 91 + FP 6）</small></div><div class="metric"><span>字段召回率</span><strong>94.8<small>%</small></strong><small>TP 91 /（TP 91 + FN 5）</small></div><div class="metric"><span>微平均 F1</span><strong>94.3<small>%</small></strong><small>2TP /（2TP + FP + FN）</small></div></div><div class="table-scroll"><table><thead><tr><th>字段类别</th><th>正确 TP</th><th>错提 FP</th><th>漏提 FN</th><th>F1</th></tr></thead><tbody>${rows.map(([name,tp,fp,fn])=>{const f1=(2*tp/(2*tp+fp+fn)*100).toFixed(1);return `<tr><td>${name}</td><td>${tp}</td><td>${fp}</td><td>${fn}</td><td><span class="bar-track"><i style="width:${f1}%"></i></span>${f1}%</td></tr>`}).join('')}</tbody></table></div><div class="page-description">上线前还需评估 span 证据定位、关系与时间、术语映射、高风险错误、人工审核耗时和单份成本。训练与测试按患者隔离。</div></section>`}
function qualityDrawer(){openDrawer('评测指标口径',`<div class="notice warn">当前页面全部为模拟评测计数，不能用于证明模型效果。</div>${[['精确率','正确抽取 / 全部抽取。反映输出有多少可信事实。'],['召回率','正确抽取 / 金标准全部事实。反映遗漏程度。'],['F1','精确率和召回率的调和平均。页面汇总使用微平均。'],['关键错误单独报告','否定变肯定、剂量错误、患者关联错误不能被总体分数掩盖。'],['置信度需要校准','不把模型自己给出的百分比当可靠概率。'],['独立测试集','按患者隔离并冻结测试集，审核纠错不直接回流污染测试集。']].map(([a,b])=>`<div class="timeline-entry"><h3>${a}</h3><p>${b}</p></div>`).join('')}`)}
function helpDrawer(){openDrawer('欢迎使用临床数据结构化平台',`<div class="eyebrow">CLINICAL DATA, WITH EVIDENCE.</div><p style="font-size:13px;line-height:1.9;margin:8px 0 22px">这是病历结构化与审核的交互原型。所有病例均为合成数据，未接入真实模型。</p>${[['01 · 对照原文','点击中间字段，左侧自动切换文书并高亮证据。'],['02 · 编辑与复核','双击字段或点击底部编辑按钮，填写修改理由；在右侧处置两个质量问题。'],['03 · 完成审核','核对所有字段后勾选确认，再点击完成审核。编辑已审核结果会重新进入待审核。'],['04 · 导出结果','可以下载 JSON 或 CSV。尚未审核的内容明确标记为草稿。']].map(([a,b])=>`<div class="timeline-entry"><h3>${a}</h3><p>${b}</p></div>`).join('')}<div class="notice">文件导入只在浏览器本地预览。页面不上传文档；刷新会恢复初始演示状态。</div><p class="form-hint">设计参考：<a href="https://github.com/medplum/medplum-chart-demo" target="_blank" rel="noopener">Medplum Chart Demo ↗</a> · <a href="https://github.com/HumanSignal/label-studio" target="_blank" rel="noopener">Label Studio ↗</a></p>`)}
$$('.nav-button').forEach(b=>b.onclick=()=>navigate(b.dataset.page));$('#helpButton').onclick=helpDrawer;$('#closeDrawer').onclick=closeDrawer;$('#backdrop').onclick=closeDrawer;$('#globalSearch').onkeydown=e=>{if(e.key==='Enter'){state.search=e.target.value;navigate('documents')}};
document.addEventListener('keydown',e=>{if(!$('#drawer').classList.contains('open'))return;if(e.key==='Escape'){closeDrawer();return}if(e.key==='Tab'){const focusable=[...$('#drawer').querySelectorAll('button:not(:disabled),input,textarea,select,a[href]')].filter(el=>!el.hidden);const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(['review','documents','templates','terminology','datasets','quality'].includes(p)&&p!==state.page){state.page=p;render()}});
if(['review','documents','templates','terminology','datasets','quality'].includes(location.hash.slice(1)))state.page=location.hash.slice(1);
render();
</script>
</body>
