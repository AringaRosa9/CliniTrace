name: bljgh-dev
services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: bljgh
      POSTGRES_USER: bljgh
      POSTGRES_PASSWORD: local-only
    ports: ["127.0.0.1:25432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bljgh -d bljgh"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.2.6-alpine
    ports: ["127.0.0.1:26379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local-bljgh
      MINIO_ROOT_PASSWORD: local-only-change-me
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["object-data:/data"]
volumes:
  postgres-data:
  object-data:
