# Place in the private Compose network. Mount /run/secrets/metrics_token separately.
global:
  scrape_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: clinical-api
    metrics_path: /internal/metrics
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: [api:8000]
  - job_name: clinical-runtime
    metrics_path: /internal/metrics
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: [monitor:9100]
